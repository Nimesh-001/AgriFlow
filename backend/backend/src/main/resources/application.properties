# ==============================================================================
# AgriFlow Backend Configuration
# ==============================================================================
spring.application.name=agriflow-backend
server.port=${PORT:8080}

# Database Connection via Environment Variables (never hardcode credentials)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agriflow_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.pool-name=AgriFlowHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# SQL and Logging
logging.level.org.springframework.jdbc=INFO
logging.level.com.agriflow=DEBUG